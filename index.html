<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIME FILE — Immersive Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ── RESET & ROOT ───────────────────── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #06090e;
      --bg2: #0a1017;
      --surface: #101821;
      --surface2: #17212e;
      --border: #1f2d3f;
      --border-light: #2a3b50;
      --tx: #f0ede8;
      --tx-muted: #9aa3b8;
      --tx-dim: #5e6a82;
      --gold: #df8bda;
      --gold-light: #e099dc;
      --gold-dim: #cc73c6;
      --gold-glow: rgba(223, 90, 205, 0.18);
      --red: #c85a4f;
      --red-dim: rgba(200, 90, 79, .12);
      --green: #52c48a;
      --green-dim: rgba(82, 196, 138, .12);
      --yellow: #d4a843;
      --yellow-dim: rgba(212, 168, 67, .12);
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 16px 56px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .02);
      --transition: .4s cubic-bezier(.34, 1.2, .64, 1);
      --font-serif: 'Shippori Mincho', serif;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html {
      scroll-behavior: smooth;
    }
    body {
      background-image: url("https://media.discordapp.net/attachments/1432348382164291604/1528928081103028254/image.png?ex=6a6014bc&is=6a5ec33c&hm=d672d09f50c7a9038d764ea97f61ac5bbd2162bd9eeea4c2005b19077ae7bd4b&=&format=webp&quality=lossless&width=1522&height=856");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed; /* Stays in place */
      color: var(--tx);
      font-family: var(--font-sans);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection {
      background: rgba(223, 184, 90, .25);
      color: #fff;
    }
    a {
      color: var(--gold);
      text-decoration: none;
    }
    a:hover {
      color: var(--gold-light);
    }

    /* ── ORBS ───────────────────────────── */
    .orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      animation: orbFloat 28s ease-in-out infinite;
      will-change: transform;
    }
    .orb-1 {
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(223, 184, 90, .05), transparent 70%);
      top: -25%;
      left: -20%;
      animation-duration: 30s;
    }
    .orb-2 {
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(200, 90, 79, .04), transparent 70%);
      top: 10%;
      right: -25%;
      animation-delay: -12s;
      animation-duration: 34s;
    }
    .orb-3 {
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(82, 196, 138, .03), transparent 70%);
      bottom: -30%;
      left: 15%;
      animation-delay: -20s;
      animation-duration: 32s;
    }
    @keyframes orbFloat {
      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(50px, -40px) scale(1.05);
      }
      66% {
        transform: translate(-40px, 50px) scale(.95);
      }
    }

    /* ── OVERLAY ────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, #0a1017, #06090e);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity .8s, visibility .8s;
    }
    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .loader-ring {
      position: relative;
      width: 104px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader-ring svg {
      position: absolute;
    }
    .loader-ring .arc {
      animation: spin 1.2s linear infinite;
      transform-origin: 52px 52px;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .loader-kanji {
      font-family: var(--font-serif);
      font-size: 36px;
      color: var(--gold);
      text-shadow: 0 0 50px var(--gold-glow);
      animation: pulse 2.2s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: .7;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
    .loader-brand {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--tx);
    }
    .loader-brand span {
      color: var(--gold);
    }
    #loaderText {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--tx-dim);
      letter-spacing: .8px;
    }
    .loader-track {
      width: 260px;
      height: 3px;
      border-radius: 2px;
      background: var(--surface2);
      overflow: hidden;
    }
    .loader-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-light));
      width: 0%;
      transition: width .5s;
      box-shadow: 0 0 16px var(--gold-glow);
    }
    .loader-dots {
      display: flex;
      gap: 8px;
    }
    .loader-dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-dim);
      animation: dotPulse 1.5s ease-in-out infinite;
      display: block;
    }
    .loader-dots i:nth-child(2) {
      animation-delay: .25s;
    }
    .loader-dots i:nth-child(3) {
      animation-delay: .5s;
    }
    @keyframes dotPulse {
      0%,
      100% {
        transform: scale(.5);
        opacity: .3;
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* ── APP ────────────────────────────── */
    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 80px;
      position: relative;
      z-index: 1;
    }

    /* ── TOPBAR ─────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      position: relative;
      backdrop-filter: blur(6px);
    }
    .topbar::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 50px;
      right: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(223, 184, 90, .12), transparent);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-seal {
      width: 50px;
      height: 50px;
      flex: none;
      border-radius: 50%;
      border: 2px solid var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red);
      font-family: var(--font-serif);
      font-size: 22px;
      box-shadow: 0 0 0 4px rgba(200, 90, 79, .06), 0 0 32px rgba(200, 90, 79, .15);
      transform: rotate(-5deg);
      transition: transform var(--transition), box-shadow var(--transition);
      animation: sealGlow 5s ease-in-out infinite;
    }
    .brand-seal:hover {
      transform: rotate(0deg) scale(1.1);
      box-shadow: 0 0 0 6px rgba(200, 90, 79, .12), 0 0 50px rgba(200, 90, 79, .25);
    }
    @keyframes sealGlow {
      0%,
      100% {
        box-shadow: 0 0 0 4px rgba(200, 90, 79, .06), 0 0 32px rgba(200, 90, 79, .15);
      }
      50% {
        box-shadow: 0 0 0 6px rgba(200, 90, 79, .12), 0 0 50px rgba(200, 90, 79, .25);
      }
    }
    .brand-text h1 {
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: 28px;
      letter-spacing: .5px;
      line-height: 1;
      background: linear-gradient(135deg, var(--tx), #c8c4b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-text h1 span {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-text p {
      margin: 4px 0 0;
      font-size: 10.5px;
      color: var(--tx-dim);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .mode-switch {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      background: var(--bg2);
      gap: 4px;
    }
    .mode-switch button {
      border: none;
      background: transparent;
      color: var(--tx-dim);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .mode-switch button span {
      font-size: 14px;
    }
    .mode-switch button.active {
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: #14100a;
      font-weight: 700;
      box-shadow: 0 2px 20px rgba(223, 184, 90, .25);
    }
    .mode-switch button:not(.active):hover {
      color: var(--tx);
      background: rgba(255, 255, 255, .03);
    }

    /* ── STATUS ──────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .status-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--tx-dim);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .status-attempts {
      font-family: var(--font-mono);
      font-size: 15px;
      color: var(--tx-dim);
    }
    .status-attempts strong {
      color: var(--gold);
      font-size: 22px;
    }
    .pips {
      display: inline-flex;
      gap: 7px;
    }
    .pip {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }
    .pip::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, .08), transparent);
    }
    .pip.used {
      background: var(--gold-dim);
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(223, 184, 90, .25);
    }
    .pip.miss {
      background: var(--red);
      border-color: var(--red);
      box-shadow: 0 0 14px rgba(200, 90, 79, .35);
    }
    .pip.hit {
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 18px rgba(82, 196, 138, .3);
    }
    .status-date {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--tx-dim);
      background: var(--bg2);
      padding: 4px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .shortcut-hint {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--tx-dim);
      padding: 4px 14px;
      background: var(--bg2);
      border-radius: 999px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .shortcut-hint kbd {
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 9px;
      color: var(--tx-muted);
    }

    /* ── STATS BAR ───────────────────────── */
    .stats-bar {
      display: flex;
      gap: 28px;
      padding: 10px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--tx-dim);
    }
    .stat-item strong {
      color: var(--gold);
      font-size: 16px;
    }
    .stat-item .icon {
      font-size: 16px;
    }

    /* ── SEARCH ─────────────────────────── */
    .search-wrap {
      position: relative;
      margin-bottom: 20px;
    }
    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--tx-dim);
      pointer-events: none;
      transition: color var(--transition);
    }
    .search-wrap:focus-within .search-icon {
      color: var(--gold);
    }
    #searchInput {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--tx);
      font-family: var(--font-sans);
      font-size: 17px;
      padding: 18px 24px 18px 56px;
      border-radius: var(--radius-sm);
      outline: none;
      transition: all var(--transition);
      box-shadow: var(--shadow);
    }
    #searchInput::placeholder {
      color: var(--tx-dim);
    }
    #searchInput:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 5px var(--gold-glow), var(--shadow);
      background: var(--surface2);
    }
    #searchInput:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .suggestions {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      max-height: 420px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 28px 72px rgba(0, 0, 0, .75);
      animation: slideDown .2s ease;
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .suggestions.hidden {
      display: none;
    }
    .suggestions::-webkit-scrollbar {
      width: 5px;
    }
    .suggestions::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition), transform .15s;
      position: relative;
    }
    .suggestion-item:last-child {
      border-bottom: none;
    }
    .suggestion-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: linear-gradient(90deg, var(--gold-glow), transparent);
      transition: width var(--transition);
    }
    .suggestion-item:hover::before,
    .suggestion-item.active::before {
      width: 4px;
    }
    .suggestion-item:hover,
    .suggestion-item.active {
      background: rgba(223, 184, 90, .05);
    }
    .suggestion-item img {
      width: 42px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      flex: none;
      background: var(--bg);
      box-shadow: 0 2px 14px rgba(0, 0, 0, .5);
      transition: transform var(--transition);
    }
    .suggestion-item:hover img {
      transform: scale(1.06);
    }
    .suggestion-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }
    .suggestion-title {
      font-size: 14.5px;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .suggestion-sub {
      font-size: 10.5px;
      color: var(--tx-dim);
      font-family: var(--font-mono);
    }
    .suggestion-empty {
      padding: 30px;
      font-size: 12px;
      color: var(--tx-dim);
      text-align: center;
      font-family: var(--font-mono);
    }
    .suggestion-item.disabled {
      opacity: .3;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ── GUESS CARDS — FULL COVER FADE ── */
    .guess-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .guess-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 26px;
      box-shadow: var(--shadow);
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      animation: cardIn .55s cubic-bezier(.34, 1.2, .64, 1) both;
      min-height: 160px;
      isolation: isolate;
    }

    /* ── FULL COVER FADE BACKGROUND ── */
    .guess-card .cover-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      opacity: 0.08;
      transition: opacity var(--transition);
      pointer-events: none;
      border-radius: var(--radius);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 90%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 90%);
      z-index: 0;
    }
    .guess-card:hover .cover-bg {
      opacity: 0.14;
    }
    .guess-card .cover-bg.blur {
      filter: blur(2px) brightness(0.7);
      opacity: 0.12;
    }

    .guess-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border-light), transparent);
      opacity: .3;
      z-index: 1;
    }
    .guess-card.win {
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), 0 16px 56px rgba(82, 196, 138, .08);
    }
    .guess-card.win::before {
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      opacity: 1;
    }
    .guess-card:not(.win):hover {
      border-color: var(--border-light);
      transform: translateY(-4px);
      box-shadow: 0 24px 72px rgba(0, 0, 0, .65);
    }

    @keyframes cardIn {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .guess-card>* {
      position: relative;
      z-index: 1;
    }

    .guess-card-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .guess-card-top .g-cover {
      width: 60px;
      height: 84px;
      object-fit: cover;
      border-radius: 10px;
      flex: none;
      background: var(--bg2);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .6);
      transition: transform var(--transition), box-shadow var(--transition);
      position: relative;
      z-index: 2;
    }
    .guess-card:hover .g-cover {
      transform: scale(1.05);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .7);
    }
    .guess-card-top .g-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--tx);
      line-height: 1.3;
      flex: 1;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .4);
      letter-spacing: -.2px;
    }
    .guess-card-top .g-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 16px;
      border-radius: 999px;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--tx-dim);
      white-space: nowrap;
    }
    .guess-card-top .g-badge.hit {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-dim);
    }
    .guess-card-top .g-badge .attempt-num {
      color: var(--gold);
      font-weight: 700;
    }

    .guess-card-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
    }
    .guess-detail {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .guess-detail .label {
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--tx-dim);
    }
    .guess-detail .value {
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .guess-detail .value .arrow {
      font-size: 14px;
      animation: arrowBounce .7s ease-in-out infinite alternate;
    }
    @keyframes arrowBounce {
      from {

      }
      to {
        transform: translateY(-4px);
      }
    }
    .guess-detail .value .chip {

      font-size: 9.5px;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--tx-dim);
      background: rgba(255, 255, 255, .02);
    }
    .guess-detail .value .chip.hit {
      border-color: var(--green);
      color: #9cdbbc;
      background: rgba(82, 196, 138, .1);

      color: #d0a09a;
      background: rgba(200, 90, 79, .06);
    }
    .guess-detail .value .match-exact {
      color: var(--green);
    }
    .guess-detail .value .match-partial {
      color: var(--yellow);
    }
    .guess-detail .value .match-none {
      color: var(--red);
    }
    .guess-detail .value .match-unknown {
      color: var(--tx-dim);
    }
    .guess-detail .value .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }
    .guess-detail .value .status-dot.exact {
      background: var(--green);
      box-shadow: 0 0 10px rgba(82, 196, 138, .4);
    }
    .guess-detail .value .status-dot.partial {
      background: var(--yellow);
      box-shadow: 0 0 10px rgba(212, 168, 67, .4);
    }
    .guess-detail .value .status-dot.none {
      background: var(--red);
      box-shadow: 0 0 10px rgba(200, 90, 79, .4);
    }

    /* ── EMPTY STATE ────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 18px;
      color: var(--tx-dim);
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .empty-state.hidden {
      display: none;
    }
    .empty-icon {
      font-size: 48px;
      animation: float 3.5s ease-in-out infinite;
    }
    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }
    .empty-state p {
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: .4px;
    }

    /* ── LEGEND ─────────────────────────── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 16px;
      padding: 14px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--tx-dim);
      font-family: var(--font-mono);
    }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex: none;
      display: inline-block;
    }
    .swatch-green {
      background: var(--green);
      box-shadow: 0 0 10px rgba(82, 196, 138, .4);
    }
    .swatch-yellow {
      background: var(--yellow);
      box-shadow: 0 0 10px rgba(212, 168, 67, .4);
    }
    .swatch-red {
      background: var(--red);
      box-shadow: 0 0 10px rgba(200, 90, 79, .4);
    }

    .footer-note {
      margin-top: 20px;
      font-size: 11px;
      color: var(--tx-dim);
      font-family: var(--font-mono);
      text-align: center;
    }

    /* ── MODAL ──────────────────────────── */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, .88);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      animation: modalBg .35s ease;
    }
    @keyframes modalBg {
      from {
        background: transparent;
      }
      to {}
    }
    .modal.hidden {
      display: none;
    }
    .modal-card {
      background: linear-gradient(160deg, var(--surface2), var(--surface));
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 48px 36px 32px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 64px 180px rgba(0, 0, 0, .9);
      animation: modalSlide .5s cubic-bezier(.34, 1.2, .64, 1);
    }
    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: translateY(36px) scale(.94);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    .modal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(223, 184, 90, .2), transparent);
    }
    .modal-stamp {
      display: inline-block;
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 3.5px;
      padding: 6px 24px;
      border: 2px solid var(--red);
      color: var(--red);
      border-radius: 8px;
      transform: rotate(-3deg);
      margin-bottom: 16px;
      box-shadow: 0 0 36px rgba(200, 90, 79, .2);
      animation: stampIn .5s cubic-bezier(.34, 1.5, .64, 1) .1s both;
    }
    @keyframes stampIn {
      from {
        transform: rotate(-3deg) scale(0);
        opacity: 0;
      }
      to {
        transform: rotate(-3deg) scale(1);
        opacity: 1;
      }
    }
    .modal-stamp.fail {
      border-color: var(--tx-dim);
      color: var(--tx-dim);
      box-shadow: none;
    }
    .modal-card h2 {
      margin: 0 0 8px;
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--tx);
    }
    .modal-card p {
      margin: 0 0 24px;
      color: var(--tx-dim);
      font-size: 14px;
      line-height: 1.6;
    }
    .modal-reveal {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--bg2);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      text-align: left;
      position: relative;
    }
    .modal-reveal::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(223, 184, 90, .04), transparent);
      pointer-events: none;
    }

      width: 56px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      flex: none;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .6);

      font-size: 16px;
      color: var(--tx);
      font-weight: 600;
      line-height: 1.3;

      color: var(--tx-dim);
      font-family: var(--font-mono);

      flex-direction: column;
      gap: 10px;
    }

      padding: 16px;
      border-radius: 14px;
      border: none;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: .4px;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }
    .modal-actions button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, .08), transparent);
      pointer-events: none;
    }
    .modal-actions button:active {
      transform: scale(.97);
    }

      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: #14100a;
      font-weight: 700;
      box-shadow: 0 4px 24px rgba(223, 184, 90, .3);
    }
    .btn-primary:hover {
      box-shadow: 0 8px 48px rgba(223, 184, 90, .45);
      transform: translateY(-2px);
    }
    .btn-ghost {
      background: transparent !important;
      border: 1px solid var(--border) !important;
      color: var(--tx-dim) !important;
    }
    .btn-ghost:hover {
      color: var(--tx) !important;
      border-color: var(--gold) !important;
      background: rgba(223, 184, 90, .04) !important;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
      color: var(--tx-dim);
      font-size: 17px;
      cursor: pointer;
      width: 36px !important;
      height: 36px;
      padding: 0 !important;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .modal-close:hover {
      background: rgba(255, 255, 255, .08);
      color: var(--tx);
    }

      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: #14100a;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 999;
      box-shadow: 0 8px 40px rgba(223, 184, 90, .3);
      letter-spacing: .3px;
    }
    .toast.show {
      opacity: 1;

    }

      position: fixed;
      inset: 0;
      pointer-events: none;

      }
    }

    "use strict";

    /* ── CONFETTI ───────────────────────────── */
    var launchConfetti = (function() {
      var cv = document.getElementById("confettiCanvas"),
        ctx = cv.getContext("2d"),
        pts = [],
        active = false;
      var cols = ["#dfb85a", "#f2d07a", "#52c48a", "#c85a4f", "#5b8dd9", "#e8d9a0", "#fff"];

      function draw() {
        if (!active) return;
        ctx.clearRect(0, 0, cv.width, cv.height);
        var alive = false;
        for (var i = 0; i < pts.length; i++) {
          var p = pts[i];
          p.vy += .38;
          p.vx *= .99;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.life -= .011;
          if (p.life > 0 && p.y < cv.height + 20) alive = true;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.col;
          if (p.s === "r") ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          else { ctx.beginPath();
            ctx.arc(0, 0, p.r, 0, Math.PI * 2);
            ctx.fill(); }
          ctx.restore();
        }
        if (alive) requestAnimationFrame(draw);
        else { active = false;
          ctx.clearRect(0, 0, cv.width, cv.height); }
      }
      return function() {
        cv.width = window.innerWidth;
        cv.height = window.innerHeight;
        pts = [];
        for (var i = 0; i < 140; i++) pts.push({
          x: cv.width / 2 + (Math.random() - .5) * 220,
          y: cv.height * .38,
          vx: (Math.random() - .5) * 15,
          vy: Math.random() * -18 - 4,
          r: Math.random() * 6 + 2,
          col: cols[0 | Math.random() * cols.length],
          rot: Math.random() * 360,
          vr: (Math.random() - .5) * 11,
          life: 1,
          s: Math.random() > .5 ? "r" : "c"
        });
        active = true;
        draw();
      };
    })();

    /* ── GAME ───────────────────────────────── */
    var AURL = "https://graphql.anilist.co",
      PP = 10,
      PPP = 50,
      MT = 8,
      PCK = "af_pool_v2",
      PCM = 864e5;
    var pool = [],
      mode = "daily",
      secret = null,
      guesses = [],
      over = false,
      won = false,
      aidx = -1,
      cSuggs = [],
      debT = null;

    var stats = {
      gamesPlayed: 0,
      wins: 0,
      bestStreak: 0,
      currentStreak: 0,
      totalAttempts: 0,
      bestAttempts: Infinity
    };

    var overlay = document.getElementById("overlay");
    var loaderText = document.getElementById("loaderText");
    var pFill = document.getElementById("progressFill");
    var sInput = document.getElementById("searchInput");
    var suggBox = document.getElementById("suggestions");
    var gRows = document.getElementById("guessRows");
    var triesEl = document.getElementById("triesUsed");
    var pipsEl = document.getElementById("pips");
    var dateEl = document.getElementById("dateLabel");
    var btnD = document.getElementById("btnDaily");
    var btnP = document.getElementById("btnPractice");
    var modal = document.getElementById("endModal");
    var stampEl = document.getElementById("stampResult");
    var titleEl = document.getElementById("endTitle");
    var subEl = document.getElementById("endSubtitle");
    var revealEl = document.getElementById("secretReveal");
    var shareBtn = document.getElementById("shareBtn");
    var newBtn = document.getElementById("newGameBtn");
    var closeBtn = document.getElementById("modalClose");
    var toastEl = document.getElementById("toast");
    var emptyEl = document.getElementById("emptyState");
    var bestStreakEl = document.getElementById("bestStreak");
    var gamesPlayedEl = document.getElementById("gamesPlayed");
    var winRateEl = document.getElementById("winRate");
    var avgAttemptsEl = document.getElementById("avgAttempts");
    var bestAttemptsEl = document.getElementById("bestAttempts");

    var PQ =
      "query($page:Int,$perPage:Int){Page(page:$page,perPage:$perPage){media(sort:POPULARITY_DESC,type:ANIME,isAdult:false,format_not:MUSIC){id title{romaji english}format startDate{year}episodes genres averageScore source studios(isMain:true){nodes{name}}coverImage{medium}}}}";
    var SQ =
      "query($search:String){Page(page:1,perPage:8){media(search:$search,type:ANIME,isAdult:false,sort:POPULARITY_DESC){id title{romaji english}format startDate{year}episodes genres averageScore source studios(isMain:true){nodes{name}}coverImage{medium}}}}";

    async function gql(query, variables, retries) {
      if (retries === undefined) retries = 3;
      var res = await fetch(AURL, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify({ query: query, variables: variables }) });
      if (res.status === 429 && retries > 0) { var w = parseFloat(res.headers.get("Retry-After") || "2") * 1000;
        await new Promise(r => setTimeout(r, w)); return gql(query, variables, retries - 1); }
      if (!res.ok) throw new Error("AniList " + res.status);
      var j = await res.json();
      if (j.errors) throw new Error(j.errors[0].message);
      return j.data;
    }

    function nm(m) {
      var s = m.studios && m.studios.nodes && m.studios.nodes[0];
      return {
        id: m.id,
        title: (m.title.english || m.title.romaji || "Untitled").trim(),
        cover: (m.coverImage && m.coverImage.medium) || "",
        format: m.format || null,
        year: (m.startDate && m.startDate.year) || null,
        episodes: (m.episodes === 0 ? null : m.episodes) || null,
        genres: m.genres || [],
        score: (m.averageScore === 0 ? null : m.averageScore) || null,
        source: m.source || null,
        studio: s ? s.name : null
      };
    }

    async function loadPool() {
      try {
        var c = localStorage.getItem(PCK);
        if (c) { var p = JSON.parse(c); if (Date.now() - p.ts < PCM && p.data && p.data.length > 400) return p.data; }
      } catch (e) {}
      var all = [],
        seen = new Set();
      for (var pg = 1; pg <= PP; pg++) {
        loaderText.textContent = "Compiling archive… " + all.length + "/" + (PP * PPP);
        pFill.style.width = Math.round(((pg - 1) / PP) * 100) + "%";
        var d = await gql(PQ, { page: pg, perPage: PPP });
        var md = d.Page.media || [];
        for (var i = 0; i < md.length; i++) { if (seen.has(md[i].id)) continue;
          seen.add(md[i].id);
          all.push(nm(md[i])); }
        if (md.length < PPP) break;
        await new Promise(r => setTimeout(r, 180));
      }
      pFill.style.width = "100%";
      localStorage.setItem(PCK, JSON.stringify({ ts: Date.now(), data: all }));
      return all;
    }

    function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

    function seed(n) { var s = today(),
        h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % n; }

    function sk(m) { return m === "daily" ? "af_state_daily_" + today() : "af_state_practice"; }

    function save() {
      localStorage.setItem(sk(mode), JSON.stringify({ secret: secret, guesses: guesses, over: over, won: won }));
      localStorage.setItem("af_stats", JSON.stringify(stats));
    }

    function loadSt(m) { try { return JSON.parse(localStorage.getItem(sk(m))); } catch (e) { return null; } }

    function loadStats() {
      try { var s = JSON.parse(localStorage.getItem("af_stats")); if (s) Object.assign(stats, s); } catch (e) {}
      updateStatsUI();
    }

    function updateStatsUI() {
      bestStreakEl.textContent = stats.bestStreak || "—";
      gamesPlayedEl.textContent = stats.gamesPlayed || 0;
      winRateEl.textContent = stats.gamesPlayed > 0 ? Math.round((stats.wins / stats.gamesPlayed) * 100) + "%" : "—";
      avgAttemptsEl.textContent = stats.gamesPlayed > 0 ? Math.round(stats.totalAttempts / stats.gamesPlayed) : "—";
      bestAttemptsEl.textContent = stats.bestAttempts !== Infinity ? stats.bestAttempts : "—";
    }

    function updateStatsAfterGame(won, attempts) {
      stats.gamesPlayed++;
      if (won) {
        stats.wins++;
        stats.currentStreak++;
        if (stats.currentStreak > stats.bestStreak) stats.bestStreak = stats.currentStreak;
        if (attempts < stats.bestAttempts) stats.bestAttempts = attempts;
      } else {
        stats.currentStreak = 0;
      }
      stats.totalAttempts += attempts;
      save();
      updateStatsUI();
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" } [c]; }); }

    function fmt(v) { if (!v) return "—"; return v.replace(/_/g, " ").replace(/\w\S*/g, function(t) { return t[0].toUpperCase() + t.slice(1).toLowerCase(); }); }

    function ag(d) { return d === "up" ? "⬆️" : "⬇️"; }

    function cmpE(g, s) { if (g == null || s == null) return { st: "u" }; return { st: g === s ? "c" : "w" }; }

    function cmpN(g, s) { if (g == null || s == null) return { st: "u" }; if (g === s) return { st: "c" }; return { st: "w", arr: g < s ? "up" : "down" }; }

    function cmpG(g, s) { g = g || [];
      s = s || [];
      var ss = new Set(s),
        m = g.filter(function(x) { return ss.has(x); });
      var st; if (s.length > 0 && m.length === s.length && g.length === s.length) st = "c";
      else if (m.length > 0) st = "p";
      else st = "w"; return { st: st, m: new Set(m) }; }

    function stCls(st) { return st === "c" ? "match-exact" : st === "p" ? "match-partial" : st === "w" ? "match-none" : "match-unknown"; }

    function stDot(st) { return st === "c" ? "exact" : st === "p" ? "partial" : st === "w" ? "none" : ""; }

    function startMode(m, fresh) {
      if (fresh === undefined) fresh = false;
      mode = m;
      btnD.classList.toggle("active", m === "daily");
      btnP.classList.toggle("active", m === "practice");
      newBtn.style.display = m === "practice" ? "block" : "none";
      var sv = !fresh ? loadSt(m) : null;
      if (sv && sv.secret) { secret = sv.secret;
        guesses = sv.guesses;
        over = sv.over;
        won = sv.won; } else { var idx = m === "daily" ? seed(pool.length) : Math.floor(Math.random() * pool.length);
        secret = pool[idx];
        guesses = [];
        over = false;
        won = false;
        save(); }
      dateEl.textContent = m === "daily" ? "Case #" + today() : "Untimed practice";
      loadStats();
      renderAll();
      if (over) showModal();
      else hideModal();
    }

    function renderPips() {
      pipsEl.innerHTML = "";
      for (var i = 0; i < MT; i++) {
        var s = document.createElement("span");
        s.className = "pip";
        if (i < guesses.length) s.classList.add(guesses[i].id === secret.id ? "hit" : "used");
        pipsEl.appendChild(s);
      }
    }

    function renderAll() {
      gRows.innerHTML = "";
      for (var i = 0; i < guesses.length; i++) addCard(guesses[i], false);
      triesEl.textContent = guesses.length;
      renderPips();
      sInput.disabled = over;
      sInput.placeholder = over ? "Case closed — switch mode" : "Search the archive by title…";
      emptyEl.classList.toggle("hidden", guesses.length > 0);
    }

    function addCard(guess, anim) {
      var isW = guess.id === secret.id;
      var fe = cmpE(guess.format, secret.format);
      var yr = cmpN(guess.year, secret.year);
      var ep = cmpN(guess.episodes, secret.episodes);
      var gn = cmpG(guess.genres, secret.genres);
      var st = cmpE(guess.studio, secret.studio);
      var sc = cmpE(guess.source, secret.source);
      var sg = cmpN(guess.score, secret.score);

      var card = document.createElement("div");
      card.className = "guess-card" + (isW ? " win" : "");
      if (anim) card.style.animationDelay = (guesses.length * 70) + "ms";

      // Full cover background fade
      var coverBg = document.createElement("div");
      coverBg.className = "cover-bg" + (guess.cover ? "" : " blur");
      if (guess.cover) {
        coverBg.style.backgroundImage = 'url("' + guess.cover + '")';
      } else {
        coverBg.style.background = 'radial-gradient(circle, var(--surface2), var(--surface))';
      }
      card.appendChild(coverBg);

      var genreChips = (guess.genres.length ? guess.genres : ["—"]).map(function(g) {
        return '<span class="chip ' + (guess.genres.length ? (gn.m.has(g) ? "hit" : "miss") : "") + '">' + esc(g) + "</span>";
      }).join("");

      var detailItems = [
        { label: "Format", value: fmt(guess.format), cls: stCls(fe.st), dot: stDot(fe.st), extra: "" },
        { label: "Year", value: guess.year || "—", cls: stCls(yr.st), dot: stDot(yr.st), extra: yr.arr ? '<span class="arrow">' +
            ag(yr.arr) + '</span>' : "" },
        { label: "Episodes", value: guess.episodes || "?", cls: stCls(ep.st), dot: stDot(ep.st), extra: ep.arr ?
          '<span class="arrow">' + ag(ep.arr) + '</span>' : "" },
        { label: "Genres", value: genreChips, cls: stCls(gn.st), dot: stDot(gn.st), extra: "" },
        { label: "Studio", value: guess.studio || '<span style="color:var(--tx-dim);font-style:italic;">Unknown</span>',
          cls: stCls(st.st), dot: stDot(st.st), extra: "" },
        { label: "Source", value: fmt(guess.source), cls: stCls(sc.st), dot: stDot(sc.st), extra: "" },
        { label: "Score", value: guess.score || "—", cls: stCls(sg.st), dot: stDot(sg.st), extra: sg.arr ?
          '<span class="arrow">' + ag(sg.arr) + '</span>' : "" }
      ];

      var detailsHtml = detailItems.map(function(d) {
        var dotHtml = d.dot ? '<span class="status-dot ' + d.dot + '"></span>' : "";
        return '<div class="guess-detail"><span class="label">' + d.label + '</span><div class="value ' + d.cls + '">' +
          dotHtml + ' ' + d.value + ' ' + d.extra + '</div></div>';
      }).join("");

      card.innerHTML += `
        <div class="guess-card-top">
          ${guess.cover ? '<img class="g-cover" src="' + esc(guess.cover) + '" alt="" loading="lazy">' : ''}
          <div class="g-title">${esc(guess.title)}</div>
          <span class="g-badge ${isW ? 'hit' : ''}">#<span class="attempt-num">${guesses.length + 1}</span></span>
        </div>
        <div class="guess-card-details">
          ${detailsHtml}
        </div>
      `;

      gRows.appendChild(card);
    }

    function submitGuess(media) {
      if (over) return;
      for (var i = 0; i < guesses.length; i++) { if (guesses[i].id === media.id) { flashToast("Already logged that entry"); return; } }
      guesses.push(media);
      addCard(media, true);
      emptyEl.classList.add("hidden");
      triesEl.textContent = guesses.length;
      renderPips();
      if (media.id === secret.id) { over = true;
        won = true; } else if (guesses.length >= MT) { over = true;
        won = false; }
      save();
      sInput.value = "";
      hideSuggs();
      if (over) {
        sInput.disabled = true;
        sInput.placeholder = "Case closed — switch mode";
        updateStatsAfterGame(won, guesses.length);
        setTimeout(function() { showModal(); if (won) launchConfetti(); }, 600);
      }
    }

    function showModal() {
      stampEl.textContent = won ? "SOLVED" : "UNSOLVED";
      stampEl.classList.toggle("fail", !won);
      titleEl.textContent = won ? "Case closed" : "Case cold";
      subEl.textContent = won ? "Identified in " + guesses.length + "/" + MT + " attempts." : "Archive entry remained unidentified after " + MT + " attempts.";
      revealEl.innerHTML = (secret.cover ? '<img src="' + esc(secret.cover) + '" alt="">' : "") +
        '<div><div class="reveal-title">' + esc(secret.title) + '</div><div class="reveal-sub">' + fmt(secret.format) + " · " + (
          secret.year ? secret.year : "—") + " · " + fmt(secret.source) + '</div></div>';
      modal.classList.remove("hidden");
    }

    function hideModal() { modal.classList.add("hidden"); }

    function buildShare() {
      var hdr = mode === "daily" ? "ANIME FILE — Case #" + today() + " — " + (won ? guesses.length : "X") + "/" + MT :
        "ANIME FILE — Practice — " + (won ? guesses.length : "X") + "/" + MT;
      var lines = guesses.map(function(g) {
        var fe = cmpE(g.format, secret.format),
          yr = cmpN(g.year, secret.year),
          ep = cmpN(g.episodes, secret.episodes);
        var gn = cmpG(g.genres, secret.genres),
          st = cmpE(g.studio, secret.studio),
          sc = cmpE(g.source, secret.source),
          sg = cmpN(g.score, secret.score);

        function e(r) { if (r.st === "c") return "🟩"; if (r.st === "p") return "🟨"; if (r.st === "u") return "⬜"; if (r
            .arr) return ag(r.arr); return "🟥"; }
        return [fe, yr, ep, gn, st, sc, sg].map(e).join("");
      });
      return hdr + "\n" + lines.join("\n") + "\n\nPlay: AniList-powered anime guessing game";
    }

    function flashToast(msg) { toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(function() { toastEl.classList.remove("show"); }, 1800); }

    shareBtn.addEventListener("click", async function() {
      try { await navigator.clipboard.writeText(buildShare());
        flashToast("Share card copied ✓"); } catch (e) { flashToast("Copy failed — select text manually"); }
    });
    newBtn.addEventListener("click", function() { hideModal();
      startMode("practice", true); });
    closeBtn.addEventListener("click", hideModal);
    modal.addEventListener("click", function(e) { if (e.target === modal) hideModal(); });
    btnD.addEventListener("click", function() { startMode("daily"); });
    btnP.addEventListener("click", function() { startMode("practice"); });

    function hideSuggs() { suggBox.classList.add("hidden");
      suggBox.innerHTML = "";
      cSuggs = [];
      aidx = -1; }

    function renderSuggs(items) {
      cSuggs = items;
      aidx = -1;
      if (!items.length) { suggBox.innerHTML = '<div class="suggestion-empty">No matching archive entries</div>';
        suggBox.classList.remove("hidden"); return; }
      var html = "";
      for (var i = 0; i < items.length; i++) {
        var m = items[i],
          done = false;
        for (var j = 0; j < guesses.length; j++) { if (guesses[j].id === m.id) { done = true; break; } }
        html += '<div class="suggestion-item' + (done ? " disabled" : "") + '" data-i="' + i + '">' +
          (m.cover ? '<img src="' + esc(m.cover) + '" alt="" loading="lazy">' : '') +
          '<div class="suggestion-meta"><div class="suggestion-title">' + esc(m.title) + '</div>' +
          '<div class="suggestion-sub">' + fmt(m.format) + " · " + (m.year ? m.year : "—") + (done ? " · already logged" :
            "") + '</div></div></div>';
      }
      suggBox.innerHTML = html;
      suggBox.classList.remove("hidden");
      var els = suggBox.querySelectorAll(".suggestion-item");
      for (var i = 0; i < els.length; i++) {
        (function(el) { el.addEventListener("click", function() { if (el.classList.contains("disabled")) return;
            submitGuess(cSuggs[parseInt(el.dataset.i, 10)]); }); })(els[i]);
      }
    }

    sInput.addEventListener("input", function() {
      var q = sInput.value.trim();
      clearTimeout(debT);
      if (q.length < 2) { hideSuggs(); return; }
      debT = setTimeout(async function() {
        try { var d = await gql(SQ, { search: q });
          var items = (d.Page.media || []).map(nm); if (sInput.value.trim() === q) renderSuggs(items); } catch (e) { suggBox
            .innerHTML = '<div class="suggestion-empty">Archive lookup failed — try again</div>';
          suggBox.classList.remove("hidden"); }
      }, 320);
    });

    sInput.addEventListener("keydown", function(e) {
      if (suggBox.classList.contains("hidden")) return;
      var els = suggBox.querySelectorAll(".suggestion-item");
      if (e.key === "ArrowDown") { e.preventDefault();
        aidx = Math.min(aidx + 1, els.length - 1); for (var i = 0; i < els.length; i++) els[i].classList.toggle("active",
          i === aidx); } else if (e.key === "ArrowUp") { e.preventDefault();
        aidx = Math.max(aidx - 1, 0); for (var i = 0; i < els.length; i++) els[i].classList.toggle("active", i === aidx); } else if (
        e.key === "Enter") { e.preventDefault(); var idx = aidx >= 0 ? aidx : 0; var c = cSuggs[idx]; var dup = false; for (
          var i = 0; i < guesses.length; i++) { if (guesses[i].id === c.id) { dup = true; break; } } if (c && !dup)
          submitGuess(c); } else if (e.key === "Escape") hideSuggs();
    });

    document.addEventListener("click", function(e) { if (!e.target.closest(".search-wrap")) hideSuggs(); });

    /* ── INIT ── */
    (async function init() {
      try { pool = await loadPool(); } catch (e) { loaderText.textContent = "Failed to reach AniList. Please refresh and try again.";
        pFill.style.background = "var(--red)"; return; }
      overlay.classList.add("hidden");
      loadStats();
      startMode("daily");
    })();
  </script>
</body>
</html>
